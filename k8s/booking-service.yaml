apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service

  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: valeriakostova/booking-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082

          env:
          - name: SPRING_DATASOURCE_URL
            valueFrom:
              secretKeyRef:
                name: kubernetes-secrets
                key: BOOKING_DB_URL

          - name: SPRING_DATASOURCE_USERNAME
            valueFrom:
              secretKeyRef:
                name: kubernetes-secrets
                key: BOOKING_DB_USERNAME

          - name: SPRING_DATASOURCE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: kubernetes-secrets
                key: BOOKING_DB_PASSWORD

          - name: JWT_SECRET
            valueFrom:
              secretKeyRef:
                name: kubernetes-secrets
                key: JWT_SECRET

---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  type: LoadBalancer #Makes the program reachable from outside kubernetes (Port Forwarded ISH)
  selector:
    app: booking-service
  ports:
    - port: 8082
      targetPort: 8082


