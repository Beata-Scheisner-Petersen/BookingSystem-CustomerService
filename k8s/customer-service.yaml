apiVersion: apps/v1
kind: Deployment
metadata: #Resource Name
  name: customer-service
spec:
  replicas: 1 #How many Copies that exists
  selector:
    matchLabels:
      app: customer-service
  template: #How the POD should look/be setup
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service #Container name
          image: beatasp/booking-system-customer #what Program image to use
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: JWT_SECRET
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: CUSTOMER_DB_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: CUSTOMER_DB_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kubernetes-secrets
                  key: CUSTOMER_DB_PASSWORD


---


apiVersion: v1
kind: Service
metadata:
  name: customer-service
spec:
  type: LoadBalancer #Makes the program reachable from outside kubernetes (Port Forwarded ISH)
  selector:
    app: customer-service
  ports:
    - port: 8081
      targetPort: 8081